name: build + release

# Builds and tests on every push/PR; on `v*` tags additionally attaches a
# self-contained .vsix to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the GITHUB_TOKEN needs this to create the Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: LSP smoke test (real JSON-RPC over stdio)
        run: node scripts/lsp-smoke.mjs

      - name: Package .vsix
        env:
          # Tag pushes (v1.2.3) stamp that version into the extension; other
          # runs keep the version from client/package.json.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          VERSION="${VERSION#v}" npm run package:vsix

      - name: Verify tag matches packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -e "console.log(JSON.parse(require('fs').readFileSync('build/extension/package.json','utf8')).version)")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match extension version '$pkg' — push a tag like v$pkg instead."
            exit 1
          fi
          echo "Release version: $pkg"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-pseudocode-vsix
          path: build/*.vsix
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.vsix
          generate_release_notes: true